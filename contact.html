<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Destiny's Contact</title>
    <meta name="description" content="Destiny's Contact">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <main>
        <form>
            <fieldset>
                <legend>Your Contact Infomation</legend>
                <label for="visitor-name">Your Name:</label>
                <input type="text" name="visitor-name" id="visitor-name" placeholder="John Doe" required>
                <label for="visitor-email">Your Email:</label>
                <input type="email" name="visitor-email" id="visitor-email" placeholder="example@email.com" required>
                <label for="visitor-message">Your Messages to Me:</label>
                <textarea name="visitor-message" id="visitor-message">Your Website is Very Great!</textarea>
                <button type="submit">Submit</button>
            </fieldset>
        </form>
    </main>
</body>

</html>
